name: Scheduled publish

on:
  workflow_dispatch:
    inputs:
      notify:
        description: Notify search engines after verified deployment
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-publish-production
  cancel-in-progress: false

jobs:
  publish-window:
    runs-on: ubuntu-latest
    environment: contabo-publish
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: https://spinkorea.kr/
      GSC_SITEMAP_URL: https://spinkorea.kr/sitemap.xml
      INDEXNOW_RECENT_HOURS: 6
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check publish window
        id: gate
        run: |
          NEW=$(node -e "
            const fs=require('fs');
            const plan=JSON.parse(fs.readFileSync('src/data/content-plan.generated.json','utf8'));
            const arr=Array.isArray(plan)?plan:(plan.articles||plan.posts||[]);
            const now=Date.now(), W=26*3600000;
            const n=arr.filter(a=>{const t=a.publishAt?new Date(a.publishAt).getTime():NaN; return t>now-W && t<=now;}).length;
            console.log(n);
          ")
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NEW" = "0" ]; then RUN=false; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "최근 26h 신규 발행 도달: ${NEW}건 → 빌드 실행: ${RUN}"

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npm run content:validate

      - if: steps.gate.outputs.run == 'true'
        run: npm run type-check

      - name: Test Contabo deployment adapter
        if: steps.gate.outputs.run == 'true'
        run: node --test scripts/deploy-scheduled-contabo.test.mjs

      - name: Build and install on Contabo, then verify fresh public marker
        id: deploy
        if: steps.gate.outputs.run == 'true'
        run: node scripts/deploy-scheduled-contabo.mjs
        env:
          CONTABO_HOST: ${{ vars.SPINKOREA_CONTABO_HOST }}
          CONTABO_USER: ${{ vars.SPINKOREA_CONTABO_USER }}
          CONTABO_KNOWN_HOSTS: ${{ vars.SPINKOREA_CONTABO_KNOWN_HOSTS }}
          CONTABO_SSH_KEY: ${{ secrets.SPINKOREA_CONTABO_PUBLISH_SSH_KEY }}

      - name: Notify Google Search Console sitemap
        if: ${{ steps.deploy.outcome == 'success' && (github.event_name == 'schedule' || inputs.notify == true) && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: npm run notify:google

      - name: Notify IndexNow
        if: ${{ steps.deploy.outcome == 'success' && (github.event_name == 'schedule' || inputs.notify == true) }}
        run: npm run notify:indexnow
